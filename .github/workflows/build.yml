name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Decode keystore
        env: { KS_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon
      - name: Verify signature and size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose "$APK"
          ls -l "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: tap-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release.apk

name: test build
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Decode keystore
        env: { KS_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Make this a side-by-side test variant
        run: |
          # own app id => installs next to the real app; run number => each test build updates the last
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/applicationId '([^']*)'/applicationId '\1.test'/" app/build.gradle
          sed -i 's/android:label="Tap"/android:label="Tap test"/' app/src/main/AndroidManifest.xml
      - name: Build signed APK
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon
      - name: Verify signature and size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose "$APK"
          ls -l "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: weecounter-test-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
